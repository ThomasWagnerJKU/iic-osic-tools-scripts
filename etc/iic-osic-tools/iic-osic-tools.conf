# /etc/iic-osic-tools/iic-osic-tools.conf
# Local settings for iic-osic-tools-enable (a shell fragment, read as root).
# install.sh creates this file once and never overwrites it.

# Range of the web ports assigned to the users (at most one user per port).
# Keep it clear of other services, e.g. the eda_server_* containers of
# IIC-OSIC-TOOLS use 50001 upwards.
#PORT_MIN=50050
#PORT_MAX=50100

# firewalld zone of the interface the users connect through, empty for the
# default zone ("firewall-cmd --get-active-zones" shows the zones)
#FW_ZONE=""

