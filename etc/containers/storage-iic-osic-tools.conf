# /etc/containers/storage-iic-osic-tools.conf
# Podman storage config for all users, selected via CONTAINERS_STORAGE_CONF
# (set in /etc/profile.d/iic-osic-tools.sh and by iic-osic-tools itself).
# Without graphroot/runroot each user keeps the default own storage in
# ~/.local/share/containers, plus read-only access to the shared
# IIC-OSIC-TOOLS image of user eda.
[storage]
driver = "overlay"

[storage.options]
additionalimagestores = ["/var/local/eda/images"]

[storage.options.overlay]
# Needed to read the store, which eda pulls with force_mask = "shared"
mount_program = "/usr/bin/fuse-overlayfs"
mountopt = "nodev"
